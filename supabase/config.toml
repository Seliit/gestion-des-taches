# Configuration pour le développement local avec la CLI Supabase (`supabase start`).
project_id = "gestion-des-taches"

[api]
port = 54321
schemas = ["public"]
max_rows = 5000

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/definir-mot-de-passe"]
# Application privée : pas d'inscription libre, uniquement sur invitation.
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.invite-user]
verify_jwt = true

[functions.set-user-access]
verify_jwt = true
